<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM · Juliana Vidal Advocacia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"><\/script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d1f3c;--navy2:#162442;--navy3:#1e3058;
  --silver:#8fa8c0;--silver2:#b8ccd8;--silver3:#d4e2ec;
  --gold:#b8962e;--gold2:#d4ae50;--gold3:#e8c96a;
  --bg:#f5f7fa;--bg2:#edf0f5;--bg3:#e4e9f0;
  --white:#ffffff;
  --text:#1a2a3a;--text2:#3d5a70;--text3:#7a96aa;
  --borda:#d8e4ee;--borda2:#e8f0f6;
  --verde:#1a7a45;--verde-bg:#e8f5ee;
  --vermelho:#b02a1e;--vermelho-bg:#fce8e6;
  --amarelo:#8a6a00;--amarelo-bg:#fef8e6;
  --roxo:#4a3a9a;--roxo-bg:#eeeafc;
  --shadow:0 2px 12px rgba(13,31,60,0.08);
  --shadow2:0 4px 24px rgba(13,31,60,0.12);
}
html{scroll-behavior:smooth}
body{font-family:"DM Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.topbar{position:sticky;top:0;z-index:100;background:var(--navy);border-bottom:1px solid rgba(255,255,255,0.08);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:68px;box-shadow:0 2px 20px rgba(13,31,60,0.3)}
.logo-wrap{display:flex;align-items:center;gap:14px}
.logo-img{width:48px;height:48px;border-radius:8px;object-fit:cover;object-position:center 25%}
.logo-divider{width:1px;height:34px;background:rgba(255,255,255,0.15)}
.logo-text{display:flex;flex-direction:column;gap:2px}
.logo-name{font-family:"Cormorant Garamond",serif;font-size:17px;font-weight:500;color:#e8eef4;letter-spacing:2px;text-transform:uppercase;line-height:1.1}
.logo-sub{font-size:9px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:rgba(180,200,216,0.45)}
.topbar-right{display:flex;align-items:center;gap:8px}
.topbar-link{color:rgba(180,200,216,0.7);font-size:12px;text-decoration:none;padding:7px 16px;border:1px solid rgba(255,255,255,0.12);border-radius:20px;transition:all .2s;letter-spacing:.5px;font-weight:500}
.topbar-link:hover{color:#e8eef4;border-color:rgba(255,255,255,0.3)}
.menu-btn{background:none;border:1px solid rgba(255,255,255,0.12);cursor:pointer;color:rgba(180,200,216,0.7);font-size:18px;padding:7px 13px;border-radius:8px;transition:all .2s;line-height:1}
.menu-btn:hover{color:#e8eef4;border-color:rgba(255,255,255,0.3)}
.tabs{background:var(--white);border-bottom:2px solid var(--borda2);display:flex;padding:0 32px;position:sticky;top:68px;z-index:90;box-shadow:var(--shadow);overflow-x:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:16px 24px;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;font-family:inherit;background:none;border-top:none;border-left:none;border-right:none;white-space:nowrap;letter-spacing:.8px;text-transform:uppercase}
.tab:hover{color:var(--navy)}
.tab.active{color:var(--navy);border-bottom-color:var(--gold2);font-weight:600}
.container{max-width:1200px;margin:0 auto;padding:32px;position:relative}
.page{display:none;animation:fadeIn .25s ease}
.page.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.sec-header{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.sec-title{font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:400;color:var(--navy);letter-spacing:.5px;white-space:nowrap}
.sec-line{flex:1;height:1px;background:var(--borda)}
.sec-badge{font-size:10px;font-weight:600;color:var(--text3);font-family:"DM Mono",monospace;letter-spacing:.5px;background:var(--bg2);padding:4px 10px;border-radius:20px;border:1px solid var(--borda)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:28px}
.stat-card{background:var(--white);border:1px solid var(--borda);border-radius:12px;padding:20px 22px;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:all .2s;cursor:default}
.stat-card::after{content:"";position:absolute;top:0;left:0;width:3px;height:100%;background:var(--navy);border-radius:12px 0 0 12px;opacity:0;transition:opacity .2s}
.stat-card:hover{box-shadow:var(--shadow2);transform:translateY(-2px)}
.stat-card:hover::after{opacity:1}
.stat-card.gold::after{background:linear-gradient(180deg,var(--gold),var(--gold3))}
.stat-card.verde::after{background:var(--verde)}
.stat-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px}
.stat-value{font-family:"Cormorant Garamond",serif;font-size:38px;font-weight:400;line-height:1;color:var(--navy);margin-bottom:4px}
.stat-sub{font-size:11px;color:var(--text3);font-family:"DM Mono",monospace}
.stat-card.gold .stat-value{color:var(--gold)}
.stat-card.verde .stat-value{color:var(--verde)}
.stat-card.silver .stat-value{color:var(--silver)}
.stat-card.vermelho .stat-value{color:var(--vermelho)}
.stat-card.roxo .stat-value{color:var(--roxo)}
.rec-hero{background:var(--navy);border-radius:16px;padding:32px 36px;margin-bottom:28px;position:relative;overflow:hidden;box-shadow:var(--shadow2)}
.rec-hero::before{content:"";position:absolute;top:-60px;right:-60px;width:240px;height:240px;background:radial-gradient(circle,rgba(184,150,46,0.15) 0%,transparent 65%);pointer-events:none}
.rec-hero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:24px;position:relative;z-index:1}
.rec-item-label{font-size:10px;font-weight:600;color:rgba(180,200,216,0.5);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
.rec-item-value{font-family:"Cormorant Garamond",serif;font-size:28px;font-weight:400;color:var(--gold2);line-height:1;margin-bottom:4px}
.rec-item-sub{font-size:11px;color:rgba(180,200,216,0.4)}
.rec-divider{width:1px;background:rgba(255,255,255,0.08);align-self:stretch}
.charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:28px}
.chart-card{background:var(--white);border:1px solid var(--borda);border-radius:12px;padding:24px;box-shadow:var(--shadow)}
.chart-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:18px}
.chart-wrap{height:180px;position:relative}
@media(max-width:768px){.charts-grid{grid-template-columns:1fr}.topbar{padding:0 16px}.container{padding:16px}.tabs{padding:0 16px}}
.funil-card{background:var(--white);border:1px solid var(--borda);border-radius:12px;padding:28px;margin-bottom:20px;box-shadow:var(--shadow)}
.funil-step{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.funil-label{font-size:12px;font-weight:500;color:var(--text2);min-width:110px;text-align:right}
.funil-bar-wrap{flex:1;height:34px;background:var(--bg2);border-radius:6px;overflow:hidden}
.funil-bar{height:100%;border-radius:6px;display:flex;align-items:center;padding:0 14px;font-size:12px;font-weight:600;color:#fff;transition:width 1s cubic-bezier(.4,0,.2,1);font-family:"DM Mono",monospace;min-width:40px}
.funil-num{font-family:"DM Mono",monospace;font-size:13px;font-weight:500;min-width:32px;text-align:right;color:var(--text2)}
.funil-pct{font-family:"DM Mono",monospace;font-size:11px;color:var(--text3);min-width:38px;text-align:right}
.table-wrap{background:var(--white);border:1px solid var(--borda);border-radius:12px;overflow:hidden;margin-bottom:24px;box-shadow:var(--shadow)}
.table-header{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--borda2);flex-wrap:wrap;gap:10px}
.table-title-text{font-family:"Cormorant Garamond",serif;font-size:17px;font-weight:400;color:var(--navy);letter-spacing:.3px}
.filter-row{display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{padding:5px 13px;border-radius:20px;border:1px solid var(--borda);background:transparent;font-size:11px;font-family:inherit;cursor:pointer;color:var(--text3);transition:all .2s;font-weight:500}
.filter-btn:hover{color:var(--navy);border-color:var(--silver2)}
.filter-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
table{width:100%;border-collapse:collapse}
th{padding:10px 20px;text-align:left;font-size:10px;font-weight:600;color:var(--text3);background:var(--bg2);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--borda)}
td{padding:13px 20px;font-size:13px;border-top:1px solid var(--borda2);vertical-align:middle}
tr:hover td{background:var(--bg)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.5px}
.badge.rede{background:var(--roxo-bg);color:var(--roxo);border:1px solid rgba(74,58,154,0.15)}
.badge.banco{background:var(--amarelo-bg);color:var(--amarelo);border:1px solid rgba(184,150,46,0.2)}
.status-select{border:1px solid var(--borda);border-radius:6px;padding:4px 8px;font-size:11px;font-family:inherit;background:var(--white);color:var(--text2);cursor:pointer;outline:none}
.status-select:hover{border-color:var(--silver)}
.btn-ver{background:none;border:1px solid var(--borda);border-radius:6px;padding:4px 12px;font-size:11px;cursor:pointer;color:var(--text3);font-family:inherit;transition:all .2s}
.btn-ver:hover{color:var(--navy);border-color:var(--navy);background:var(--bg2)}
.empty{padding:56px;text-align:center;color:var(--text3);font-size:13px;font-style:italic;font-family:"Cormorant Garamond",serif}
.add-form-card{background:var(--white);border:1px solid var(--borda);border-radius:12px;padding:22px 24px;margin-bottom:20px;box-shadow:var(--shadow)}
.add-form-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.form-input,.form-select{border:1px solid var(--borda);border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;background:var(--bg);color:var(--text);transition:border .2s}
.form-input:focus,.form-select:focus{border-color:var(--navy);background:var(--white)}
.form-input::placeholder{color:var(--text3)}
.add-btn{background:var(--navy);border:none;border-radius:8px;padding:10px 22px;font-size:12px;font-family:inherit;font-weight:600;cursor:pointer;color:#fff;letter-spacing:.5px;transition:all .2s;white-space:nowrap}
.add-btn:hover{background:var(--navy2)}
@media(max-width:640px){.form-row{grid-template-columns:1fr 1fr}}
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(13,31,60,0.4);z-index:200;backdrop-filter:blur(3px)}
.drawer-overlay.open{display:block}
.drawer{position:fixed;top:0;right:-100%;width:300px;height:100%;background:var(--white);z-index:300;transition:right .3s cubic-bezier(.4,0,.2,1);overflow-y:auto;border-left:1px solid var(--borda);box-shadow:-8px 0 32px rgba(13,31,60,0.12)}
.drawer.open{right:0}
.drawer-head{background:var(--navy);padding:20px 22px;display:flex;align-items:center;justify-content:space-between}
.drawer-head h2{font-family:"Cormorant Garamond",serif;color:#e8eef4;font-size:17px;font-weight:400;letter-spacing:1px}
.drawer-close{background:none;border:none;color:rgba(180,200,216,0.6);font-size:20px;cursor:pointer;transition:color .2s}
.drawer-close:hover{color:#e8eef4}
.drawer-body{padding:16px}
.drawer-section{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;padding:14px 10px 6px}
.drawer-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:8px;cursor:pointer;transition:background .15s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.drawer-item:hover{background:var(--bg)}
.drawer-icon{font-size:16px;width:24px;text-align:center}
.drawer-text{font-size:13px;font-weight:500;color:var(--text)}
.drawer-sub{font-size:11px;color:var(--text3);margin-top:1px}
.ov{display:none;position:fixed;inset:0;background:rgba(13,31,60,0.5);z-index:400;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px)}
.ov.open{display:flex}
.box{background:var(--white);border:1px solid var(--borda);border-radius:16px;padding:32px;width:100%;box-shadow:0 20px 60px rgba(13,31,60,0.2)}
.pass-box{max-width:300px;text-align:center}
.cfg-box{max-width:480px;max-height:88vh;overflow-y:auto}
.modal-box,.edit-box{max-width:420px}
.edit-box{max-width:380px}
.boxtitle{font-family:"Cormorant Garamond",serif;font-size:20px;font-weight:400;color:var(--navy);letter-spacing:.3px;margin-bottom:6px}
.boxsub{font-size:13px;color:var(--text3);margin-bottom:24px}
.pinput{width:100%;border:1px solid var(--borda);border-radius:8px;padding:12px;font-size:20px;font-family:"DM Mono",monospace;outline:none;text-align:center;letter-spacing:8px;background:var(--bg);color:var(--navy);margin-bottom:14px;transition:border .2s}
.pinput:focus{border-color:var(--navy);background:var(--white)}
.pbtn{width:100%;background:var(--navy);border:none;border-radius:8px;padding:12px;font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;color:#fff;letter-spacing:.5px;transition:background .2s}
.pbtn:hover{background:var(--navy2)}
.perr{font-size:12px;color:var(--vermelho);margin-top:10px;display:none}
.boxrow{display:flex;justify-content:space-between;margin-bottom:18px;align-items:center}
.clx{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);transition:color .2s}
.clx:hover{color:var(--navy)}
.cfg-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;margin-top:16px;display:block}
.cfg-input{width:100%;border:1px solid var(--borda);border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;background:var(--bg);color:var(--text);transition:border .2s}
.cfg-input:focus{border-color:var(--navy);background:var(--white)}
.cfg-textarea{width:100%;border:1px solid var(--borda);border-radius:8px;padding:9px 12px;font-size:13px;font-family:inherit;outline:none;background:var(--bg);color:var(--text);resize:vertical;min-height:90px;transition:border .2s}
.cfg-textarea:focus{border-color:var(--navy);background:var(--white)}
.savebtn{width:100%;background:var(--navy);border:none;border-radius:8px;padding:12px;font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;color:#fff;letter-spacing:.5px;margin-top:20px;transition:background .2s}
.savebtn:hover{background:var(--navy2)}
.ok{font-size:12px;color:var(--verde);text-align:center;margin-top:10px;display:none;font-weight:500}
.nicho-card{border:1px solid var(--borda);border-radius:8px;padding:14px;margin-bottom:10px;background:var(--bg)}
.nicho-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nicho-name{font-size:13px;font-weight:600;color:var(--text)}
.ntoggle{background:none;border:1px solid var(--borda);border-radius:6px;padding:4px 12px;font-size:11px;cursor:pointer;font-family:inherit;color:var(--text3);transition:all .2s}
.ntoggle.ativo{background:var(--verde-bg);border-color:rgba(26,122,69,0.3);color:var(--verde)}
.add-nicho{width:100%;border:1px dashed var(--borda);border-radius:8px;padding:12px;background:none;font-size:12px;color:var(--text3);cursor:pointer;font-family:inherit;margin-top:6px;transition:all .2s}
.add-nicho:hover{border-color:var(--navy);color:var(--navy)}
.irow{display:flex;gap:12px;font-size:13px;margin-bottom:12px}
.ilbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;min-width:100px;flex-shrink:0;padding-top:2px}
.mfoot{display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--borda2)}
.mbdel{flex:1;padding:10px;border-radius:8px;border:1px solid rgba(176,42,30,.25);background:var(--vermelho-bg);font-size:12px;font-family:inherit;cursor:pointer;color:var(--vermelho);transition:all .2s}
.mbdel:hover{border-color:var(--vermelho)}
.mbcl{flex:2;padding:10px;border-radius:8px;border:1px solid var(--borda);background:transparent;font-size:12px;font-family:inherit;cursor:pointer;color:var(--text2);transition:all .2s}
.mbcl:hover{border-color:var(--navy);color:var(--navy)}
.elab{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:block}
.einp{width:100%;border:1px solid var(--borda);border-radius:8px;padding:10px 12px;font-size:14px;font-family:"DM Mono",monospace;outline:none;background:var(--bg);color:var(--gold);transition:border .2s;margin-bottom:14px}
.einp:focus{border-color:var(--gold2);background:var(--white)}
.rec-edit-btn{font-size:11px;color:var(--text3);background:none;border:1px solid var(--borda);border-radius:6px;padding:5px 12px;cursor:pointer;font-family:inherit;transition:all .2s}
.rec-edit-btn:hover{color:var(--gold);border-color:var(--gold2)}
</style>
</head>

function vS(){if(document.getElementById("pIn").value===SENHA){auth=true;document.getElementById("pOv").classList.remove("open");mCfg(cAt)}else{document.getElementById("pErr").style.display="block";document.getElementById("pIn").value=""}}
function mCfg(s){

  if(s==="honorarios"){t.textContent="Honorários";c.innerHTML='<label class="cfg-label">Percentual padrão (%)</label><input class="cfg-input" id="cH1" type="number" value="'+cfg.honorario_padrao+'"><label class="cfg-label">Percentual mínimo (%)</label><input class="cfg-input" id="cH2" type="number" value="'+cfg.honorario_minimo+'">';}
  else if(s==="escritorio"){t.textContent="Escritório";c.innerHTML='<label class="cfg-label">Nome</label><input class="cfg-input" id="cE1" value="'+cfg.escritorio_nome+'"><label class="cfg-label">OAB</label><input class="cfg-input" id="cE2" value="'+cfg.escritorio_oab+'"><label class="cfg-label">Cidade</label><input class="cfg-input" id="cE3" value="'+cfg.escritorio_cidade+'"><label class="cfg-label">Google Meu Negócio</label><input class="cfg-input" id="cE4" value="'+cfg.escritorio_gmn+'">';}
  else if(s==="nichos"){t.textContent="Nichos";c.innerHTML=cfg.nichos.map((n,i)=>'<div class="nicho-card"><div class="nicho-head"><span class="nicho-name">'+n.nome+'</span><button class="ntoggle '+( n.ativo?"ativo":"")+'" onclick="tgN('+i+')">'+(n.ativo?"&#x2713; Ativo":"Inativo")+'</button></div><label class="cfg-label">Instruções</label><textarea class="cfg-textarea" id="cN'+i+'">'+n.instrucoes+'</textarea></div>').join("")+'<button class="add-nicho" onclick="addN()">+ Novo nicho</button>';}
  document.getElementById("cOv").classList.add("open");
}
function tgN(i){let cfg=lC();cfg.nichos[i].ativo=!cfg.nichos[i].ativo;sC(cfg);mCfg("nichos")}
function addN(){const n=prompt("Nome:");if(!n)return;let cfg=lC();cfg.nichos.push({id:"n"+Date.now(),nome:n,ativo:true,instrucoes:""});sC(cfg);mCfg("nichos")}
function salvarCfg(){
  let cfg=lC();
  if(cAt==="honorarios"){cfg.honorario_padrao=document.getElementById("cH1").value;cfg.honorario_minimo=document.getElementById("cH2").value}
  else if(cAt==="escritorio"){cfg.escritorio_nome=document.getElementById("cE1").value;cfg.escritorio_oab=document.getElementById("cE2").value;cfg.escritorio_cidade=document.getElementById("cE3").value;cfg.escritorio_gmn=document.getElementById("cE4").value}
  else if(cAt==="nichos"){cfg.nichos.forEach((n,i)=>{const el=document.getElementById("cN"+i);if(el)n.instrucoes=el.value})}
  sC(cfg);document.getElementById("cfgOk").style.display="block";setTimeout(()=>document.getElementById("cfgOk").style.display="none",2500)
}
function aR(){const r=lR();document.getElementById("eMin").value=r.min;document.getElementById("eMed").value=r.med;document.getElementById("eMax").value=r.max;document.getElementById("eHon").value=r.hon;document.getElementById("eOv").classList.add("open")}
function sR(){sRec({min:+document.getElementById("eMin").value||5000,med:+document.getElementById("eMed").value||10000,max:+document.getElementById("eMax").value||15000,hon:+document.getElementById("eHon").value||40});document.getElementById("eOv").classList.remove("open");rP("receita")}
function addC(nome,caso,plat){
  if(!nome){nome=document.getElementById("iN").value.trim();caso=document.getElementById("iC").value;plat=document.getElementById("iP").value.trim();if(!nome){alert("Informe o nome.");return}document.getElementById("iN").value="";document.getElementById("iP").value=""}
  contatos.unshift({id:Date.now(),nome,caso:caso||"rede",plataforma:plat||"-",status:"aberto",via:"direto",data:new Date().toISOString()});
  sCo();rP(gP());
}
function uS(id,s){const c=contatos.find(x=>x.id===id);if(c){c.status=s;sCo()}}
function delC(){if(!mId||!confirm("Excluir?"))return;contatos=contatos.filter(x=>x.id!==mId);sCo();cM();rP(gP())}
function oM(id){
  mId=id;const c=contatos.find(x=>x.id===id);if(!c)return;
  const r=lR();const est=c.status==="fechado"?fmt(r.med*(r.hon/100)):"—";
  document.getElementById("mNome").textContent=c.nome;
  document.getElementById("mBody").innerHTML='<div class="irow"><div class="ilbl">Nome</div><div>'+c.nome+'</div></div><div class="irow"><div class="ilbl">Tipo</div><div>'+( c.caso==="banco"?"Conta Bancária":"Rede Social")+'</div></div><div class="irow"><div class="ilbl">Plataforma</div><div>'+c.plataforma+'</div></div><div class="irow"><div class="ilbl">Status</div><div>'+c.status+'</div></div><div class="irow"><div class="ilbl">Data</div><div>'+fD(c.data)+'</div></div><div class="irow"><div class="ilbl">Receita est.</div><div style="font-weight:700;color:var(--gold)">'+est+'</div></div>';
  document.getElementById("mOv").classList.add("open");
}
function cM(){document.getElementById("mOv").classList.remove("open");mId=null}
function fil(f,btn){flt=f;document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));btn.classList.add("active");rTab()}
function dCh(k){if(CH[k]){CH[k].destroy();delete CH[k]}}
const CO={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{color:"#7a96aa",font:{size:10,family:"DM Mono"}},grid:{color:"rgba(13,31,60,0.05)"}},x:{ticks:{color:"#7a96aa",font:{size:10,family:"DM Mono"}},grid:{display:false}}}};
const DO={responsive:true,maintainAspectRatio:false,cutout:"65%",plugins:{legend:{position:"bottom",labels:{color:"#3d5a70",font:{size:11,family:"DM Sans"},padding:14,boxWidth:10}}}};
function rDash(){
  const tot=contatos.length,ab=contatos.filter(x=>x.status==="aberto").length,neg=contatos.filter(x=>x.status==="negociando").length;
  const fech=contatos.filter(x=>x.status==="fechado").length,fu=contatos.filter(x=>x.status==="followup").length,des=contatos.filter(x=>x.status==="desistiu").length;
  const conv=tot>0?Math.round(fech/tot*100):0;const r=lR();const recE=fech*r.med*(r.hon/100);
  document.getElementById("sGrid").innerHTML='<div class="stat-card"><div class="stat-label">Total</div><div class="stat-value">'+tot+'</div><div class="stat-sub">contatos</div></div><div class="stat-card"><div class="stat-label">Em aberto</div><div class="stat-value" style="color:var(--amarelo)">'+ab+'</div><div class="stat-sub">aguardando</div></div><div class="stat-card"><div class="stat-label">Negociando</div><div class="stat-value silver">'+neg+'</div><div class="stat-sub">em tratativa</div></div><div class="stat-card verde"><div class="stat-label">Fechados</div><div class="stat-value">'+fech+'</div><div class="stat-sub">contratos</div></div><div class="stat-card"><div class="stat-label">Follow up</div><div class="stat-value roxo">'+fu+'</div><div class="stat-sub">retomando</div></div><div class="stat-card vermelho"><div class="stat-label">Desistiram</div><div class="stat-value">'+des+'</div><div class="stat-sub">não fecharam</div></div><div class="stat-card gold"><div class="stat-label">Conversão</div><div class="stat-value">'+conv+'%</div><div class="stat-sub">taxa geral</div></div><div class="stat-card gold"><div class="stat-label">Receita est.</div><div class="stat-value" style="font-size:22px">'+fmt(recE)+'</div><div class="stat-sub">'+r.hon+"% x "+fmt(r.med)+'</div></div>';
  const dias=[],counts=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);dias.push(d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}));const s=d.toISOString().split("T")[0];counts.push(contatos.filter(c=>c.data.startsWith(s)).length)}
  dCh("d");CH.d=new Chart(document.getElementById("cD"),{type:"bar",data:{labels:dias,datasets:[{data:counts,backgroundColor:"rgba(13,31,60,0.12)",borderColor:"rgba(13,31,60,0.3)",borderWidth:1,borderRadius:5,hoverBackgroundColor:"rgba(184,150,46,0.25)"}]},options:{...CO,plugins:{legend:{display:false}}}});
  const nR=contatos.filter(c=>c.caso==="rede").length,nB=contatos.filter(c=>c.caso==="banco").length;
  dCh("t");CH.t=new Chart(document.getElementById("cT"),{type:"doughnut",data:{labels:["Redes sociais","Conta bancária"],datasets:[{data:[nR||0,nB||0],backgroundColor:["rgba(74,58,154,0.5)","rgba(184,150,46,0.5)"],borderWidth:0}]},options:DO});
  dCh("s");CH.s=new Chart(document.getElementById("cS"),{type:"doughnut",data:{labels:["Aberto","Negociando","Fechado","Follow up","Desistiu"],datasets:[{data:[ab,neg,fech,fu,des],backgroundColor:["rgba(138,106,0,0.5)","rgba(13,31,60,0.4)","rgba(26,122,69,0.5)","rgba(74,58,154,0.5)","rgba(176,42,30,0.5)"],borderWidth:0}]},options:DO});
  const sems=["Sem -3","Sem -2","Sem -1","Esta sem"];
  const fS=sems.map((_,i)=>{const ini=new Date();ini.setDate(ini.getDate()-(3-i)*7);const fim=new Date(ini);fim.setDate(fim.getDate()+7);return contatos.filter(c=>c.status==="fechado"&&new Date(c.data)>=ini&&new Date(c.data)<fim).length});
  dCh("sm");CH.sm=new Chart(document.getElementById("cSm"),{type:"line",data:{labels:sems,datasets:[{data:fS,borderColor:"rgba(26,122,69,0.8)",backgroundColor:"rgba(26,122,69,0.06)",tension:.4,fill:true,pointBackgroundColor:"var(--verde)",pointRadius:4,pointBorderWidth:0}]},options:{...CO,plugins:{legend:{display:false}}}});
}
function rTab(){
  const lista=flt==="todos"?contatos:contatos.filter(x=>x.status===flt);const w=document.getElementById("tW");
  if(!lista.length){w.innerHTML='<div class="empty">Nenhum contato encontrado.</div>';return}
  w.innerHTML="<table><thead><tr><th>Nome</th><th>Caso</th><th>Plataforma</th><th>Status</th><th>Data</th><th></th></tr></thead><tbody>"+lista.map(c=>"<tr><td style="font-weight:600;color:var(--navy)">"+c.nome+"</td><td>"+(c.caso==="banco"?'<span class="badge banco">Banco</span>':'<span class="badge rede">Rede</span>')+"</td><td style="color:var(--text2)">"+c.plataforma+"</td><td><select class="status-select" onchange="uS("+c.id+",this.value)"><option value="aberto" "+(c.status==="aberto"?"selected":"")+" >Aberto</option><option value="negociando" "+(c.status==="negociando"?"selected":"")+" >Negociando</option><option value="fechado" "+(c.status==="fechado"?"selected":"")+" >Fechado</option><option value="followup" "+(c.status==="followup"?"selected":"")+" >Follow up</option><option value="desistiu" "+(c.status==="desistiu"?"selected":"")+" >Desistiu</option></select></td><td style="color:var(--text3);font-family:'DM Mono',monospace;font-size:11px">"+fD(c.data)+"</td><td><button class="btn-ver" onclick="oM("+c.id+")">Ver</button></td></tr>").join("")+"</tbody></table>";
}
function rFunil(){
  const et=[{l:"Entraram",n:contatos.length,c:"#0d1f3c"},{l:"Negociando",n:contatos.filter(x=>x.status==="negociando").length,c:"#4a3a9a"},{l:"Follow up",n:contatos.filter(x=>x.status==="followup").length,c:"#b8962e"},{l:"Fecharam",n:contatos.filter(x=>x.status==="fechado").length,c:"#1a7a45"},{l:"Desistiram",n:contatos.filter(x=>x.status==="desistiu").length,c:"#b02a1e"}];
  const mx=et[0].n||1;
  document.getElementById("fS").innerHTML=et.map(e=>'<div class="funil-step"><div class="funil-label">'+e.l+'</div><div class="funil-bar-wrap"><div class="funil-bar" style="background:'+e.c+';width:'+Math.max(4,e.n/mx*100)+'%;opacity:.85">'+( e.n>0?e.n:"")+'</div></div><div class="funil-num">'+e.n+'</div><div class="funil-pct">'+Math.round(e.n/mx*100)+'%</div></div>').join("");
  const fD2=contatos.filter(c=>c.status==="fechado"&&c.via!=="followup").length;const fF=contatos.filter(c=>c.status==="fechado"&&c.via==="followup").length;
  dCh("fu");CH.fu=new Chart(document.getElementById("cFU"),{type:"doughnut",data:{labels:["Direto","Via follow up"],datasets:[{data:[fD2||0,fF||0],backgroundColor:["rgba(13,31,60,0.5)","rgba(74,58,154,0.5)"],borderWidth:0}]},options:DO});
  dCh("fp");CH.fp=new Chart(document.getElementById("cFP"),{type:"doughnut",data:{labels:et.map(e=>e.l),datasets:[{data:et.map(e=>e.n),backgroundColor:["rgba(13,31,60,0.5)","rgba(74,58,154,0.4)","rgba(184,150,46,0.5)","rgba(26,122,69,0.5)","rgba(176,42,30,0.4)"],borderWidth:0}]},options:DO});
}
function rReceita(){
  const r=lR();const hon=r.hon/100;const fech=contatos.filter(c=>c.status==="fechado");const pipe=contatos.filter(c=>["negociando","followup"].includes(c.status)).length;
  document.getElementById("rH").innerHTML='<div><div class="rec-item-label">Casos fechados</div><div class="rec-item-value">'+fech.length+'</div><div class="rec-item-sub">contratos</div></div><div class="rec-divider"></div><div><div class="rec-item-label">Receita estimada</div><div class="rec-item-value">'+fmt(fech.length*r.med*hon)+'</div><div class="rec-item-sub">'+r.hon+"% x "+fmt(r.med)+'</div></div><div class="rec-divider"></div><div><div class="rec-item-label">Cenário otimista</div><div class="rec-item-value">'+fmt(fech.length*r.max*hon)+'</div><div class="rec-item-sub">'+r.hon+"% x "+fmt(r.max)+'</div></div><div class="rec-divider"></div><div><div class="rec-item-label">Em pipeline</div><div class="rec-item-value">'+pipe+'</div><div class="rec-item-sub">negociando + follow up</div></div>';
  const meses=[],recM=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i);meses.push(d.toLocaleDateString("pt-BR",{month:"short"}));const m=d.getMonth(),y=d.getFullYear();const n=fech.filter(c=>{const cd=new Date(c.data);return cd.getMonth()===m&&cd.getFullYear()===y}).length;recM.push(n*r.med*hon)}
  dCh("rm");CH.rm=new Chart(document.getElementById("cRM"),{type:"bar",data:{labels:meses,datasets:[{data:recM,backgroundColor:"rgba(184,150,46,0.2)",borderColor:"rgba(184,150,46,0.7)",borderWidth:1.5,borderRadius:5}]},options:{...CO,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>fmt(c.raw)}}},scales:{...CO.scales,y:{...CO.scales.y,ticks:{...CO.scales.y.ticks,callback:v=>fmt(v)}}}}});
  const nR=fech.filter(c=>c.caso==="rede").length,nB=fech.filter(c=>c.caso==="banco").length;
  dCh("rn");CH.rn=new Chart(document.getElementById("cRN"),{type:"doughnut",data:{labels:["Redes sociais","Conta bancária"],datasets:[{data:[nR*r.med*hon||0,nB*r.med*hon||0],backgroundColor:["rgba(74,58,154,0.5)","rgba(184,150,46,0.5)"],borderWidth:0}]},options:{...DO,plugins:{...DO.plugins,tooltip:{callbacks:{label:c=>fmt(c.raw)}}}}});
  const rt=document.getElementById("rT");
  if(!fech.length){rt.innerHTML='<div class="empty">Nenhum caso fechado ainda.</div>';return}
  rt.innerHTML="<table><thead><tr><th>Nome</th><th>Caso</th><th>Data</th><th>Mínimo</th><th>Médio</th><th>Máximo</th></tr></thead><tbody>"+fech.map(c=>"<tr><td style="font-weight:600;color:var(--navy)">"+c.nome+"</td><td>"+(c.caso==="banco"?'<span class="badge banco">Banco</span>':'<span class="badge rede">Rede</span>')+"</td><td style="color:var(--text3);font-family:'DM Mono',monospace;font-size:11px">"+fD(c.data)+"</td><td style="color:var(--text3)">"+fmt(r.min*hon)+"</td><td style="color:var(--gold);font-weight:700">"+fmt(r.med*hon)+"</td><td style="color:var(--navy2)">"+fmt(r.max*hon)+"</td></tr>").join("")+"</tbody></table>";
}
function rP(id){if(id==="dashboard")rDash();else if(id==="contatos")rTab();else if(id==="funil")rFunil();else if(id==="receita")rReceita()}
window.addEventListener("storage",e=>{if(e.key==="ana_novo_lead"&&e.newValue){try{const d=JSON.parse(e.newValue);addC(d.nome,d.caso,d.plataforma)}catch{}}});
rDash();
<\/script>
</body>
</html>
